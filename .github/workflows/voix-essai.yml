name: Essai voix clonee

# Test du clonage de la voix du proprietaire (avec son accord). Rien n'est publie. Le resultat est un fichier audio telechargeable.
on:
  workflow_dispatch:
    inputs:
      textes:
        description: "Phrases a faire dire, separees par ||"
        type: string
        default: "Dix pertes de suite. Ça arrive à tous les traders. Alors, combien te reste-t-il ?||Avec 1 % de risque par trade, il te reste environ 90 % de ton capital. Avec 10 % de risque, il ne te reste que 35 %."
      ref:
        description: "Extrait de reference (ref1, ref2 ou ref3)"
        type: string
        default: "ref1"

permissions:
  contents: read

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VOICE_KEY: ${{ secrets.VOICE_KEY }}
      VOICE_REF_ENC: ${{ github.workspace }}/voice/voix_ref.enc
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: voice
          path: voice
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Modeles gardes en cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-multilingual-v1
      - name: Installer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install chatterbox-tts cryptography
      - name: Cloner la voix
        run: |
          mkdir -p sortie
          time python voix_clone.py sortie/essai.wav "${{ github.event.inputs.textes }}" "${{ github.event.inputs.ref }}"
          for f in sortie/*.wav; do ffmpeg -loglevel error -y -i "$f" -b:a 128k "${f%.wav}.mp3"; done
          ls -la sortie
      - uses: actions/upload-artifact@v4
        with:
          name: voix-essai
          path: sortie/*.mp3
