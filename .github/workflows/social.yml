name: Posts reseaux sociaux

# Projet SEPARE du bot de signaux et du bot d'actus : autre depot, autres secrets, aucun lien avec eux.
# Toutes les 15 min le robot regarde s'il est l'heure de publier (au moins SOCIAL_GAP_MIN minutes depuis le dernier post, 170 par defaut = 6 par jour),
# fabrique une image ou une video, et la publie sur Facebook / Instagram / TikTok pour les reseaux configures.
# Rien n'est publie tant que la variable SOCIAL_LIVE n'est pas "true". Arret d'urgence : SOCIAL_LIVE=false ou SOCIAL_STOP=true.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Publier tout de suite (true/false)"
        type: string
        default: "false"
      essai:
        description: "Essai de fabrication d'une video (rien n'est publie) : true/false"
        type: string
        default: "false"
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: social-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    if: ${{ vars.SOCIAL_STOP != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      SOCIAL_STATE_DIR: ${{ github.workspace }}/state
      SOCIAL_MEDIA_DIR: ${{ github.workspace }}/media
      SOCIAL_LIVE: ${{ vars.SOCIAL_LIVE }}
      SOCIAL_GAP_MIN: ${{ vars.SOCIAL_GAP_MIN }}
      SOCIAL_MAX_PER_DAY: ${{ vars.SOCIAL_MAX_PER_DAY }}
      SOCIAL_HOURS: ${{ vars.SOCIAL_HOURS }}
      SOCIAL_VIDEO_EVERY: ${{ vars.SOCIAL_VIDEO_EVERY }}
      TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      SOCIAL_STATE_KEY: ${{ secrets.SOCIAL_STATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Etat (branche social-data)
        uses: actions/checkout@v4
        with:
          ref: social-data
          path: state
      - name: Fichiers publics pour Instagram (branche media)
        uses: actions/checkout@v4
        with:
          ref: media
          path: media
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ffmpeg
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: pip install -r requirements.txt
      - name: Voix francaise (CC BY 4.0, gardee en cache)
        uses: actions/cache@v4
        with:
          path: voix
          key: voix-siwis-medium-v1
      - name: Telecharger la voix si besoin
        run: |
          mkdir -p voix
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR/siwis/medium
          [ -s voix/fr_FR-siwis-medium.onnx.json ] || curl -sfL --retry 5 -o voix/fr_FR-siwis-medium.onnx.json $B/fr_FR-siwis-medium.onnx.json
          [ "$(stat -c %s voix/fr_FR-siwis-medium.onnx 2>/dev/null || echo 0)" = "63201294" ] || curl -sfL --retry 5 -o voix/fr_FR-siwis-medium.onnx $B/fr_FR-siwis-medium.onnx
      - name: Essai de fabrication (sans publier)
        if: ${{ github.event.inputs.essai == 'true' }}
        run: python social_runner.py --batch 1
      - name: Recuperer la video d'essai
        if: ${{ github.event.inputs.essai == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-essai
          path: lot_explicatifs/
      - name: Un cycle
        if: ${{ github.event.inputs.essai != 'true' }}
        run: python social_runner.py --once ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      - name: Sauver l'etat
        if: always()
        run: |
          cd state
          git config user.name "social-bot[bot]"
          git config user.email "social-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q --amend -m "etat $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q --force origin social-data || true
          fi
